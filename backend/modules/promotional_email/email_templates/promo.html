<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0"
               style="background:#ffffff;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,0.05);overflow:hidden;">
          <tr>
            <td style="padding:24px 32px;background:#0d9678;color:#ffffff;">
              <h1 style="margin:0;font-size:20px;letter-spacing:0.5px;">{{ app_name }}</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;color:#0f172a;font-size:15px;line-height:1.6;">
              <h2 style="margin:0 0 16px;font-size:20px;color:#0f172a;">{{ subject }}</h2>
              {{ content_html | safe }}
            </td>
          </tr>
          <tr>
            <td style="padding:18px 32px;background:#f8fafc;color:#64748b;font-size:12px;text-align:center;">
              You're receiving this from <strong>{{ app_name }}</strong>.<br/>
              &copy; {{ app_name }}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
